name: Release move-test-runner

# Tags are `move-test-runner-v<crate version>`, optionally with a `-<suffix>` for a pre-release.
on:
  push:
    tags: ["move-test-runner-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the tag against the crate version
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compare
        id: version
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "move-test-runner") | .version')
          case "$GITHUB_REF_NAME" in
            "move-test-runner-v$version") echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            "move-test-runner-v$version-"*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::tag $GITHUB_REF_NAME doesn't match crate version $version"; exit 1 ;;
          esac

  build:
    needs: version
    timeout-minutes: 90
    name: Test and build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test
        run: cargo test --locked -p move-test-runner

      - name: Build
        run: |
          cargo build --locked --release -p move-test-runner
          cp target/release/move-test-runner "move-test-runner-${{ matrix.target }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: move-test-runner-${{ matrix.target }}
          path: move-test-runner-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: move-test-runner-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" move-test-runner-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "\`move-test-runner\` for Linux on x86_64 and macOS on Apple silicon." \
            --prerelease="$PRERELEASE"
